version: "3"

vars:
  TF_DIR: terraform

tasks:
  default:
    desc: List available Dokploy tasks
    cmds:
      - task --list

  fmt:
    desc: Format OpenTofu files
    internal: true
    cmds:
      - tofu -chdir={{.TF_DIR}} fmt -recursive

  lint:
    desc: Lint OpenTofu configuration
    internal: true
    cmds:
      - tofu -chdir={{.TF_DIR}} validate

  check:
    desc: Format and lint OpenTofu
    deps: [fmt, lint]

  watch:check:
    desc: Watch OpenTofu files, then format and lint; does not touch live infrastructure
    watch: true
    sources:
      - "{{.TF_DIR}}/**/*.tf"
      - "{{.TF_DIR}}/**/*.tfvars"
    cmds:
      - tofu -chdir={{.TF_DIR}} fmt -recursive
      - tofu -chdir={{.TF_DIR}} validate

  gen:ssh:
    desc: Generate the dedicated SSH key used by the Dokploy server
    cmds:
      - |
        if [ -e "$HOME/.ssh/personal_dokploy_ed25519" ]; then
          echo "$HOME/.ssh/personal_dokploy_ed25519 already exists"
          exit 0
        fi
        ssh-keygen -t ed25519 -N "" -C personal-dokploy -f "$HOME/.ssh/personal_dokploy_ed25519"

  ssh:
    desc: SSH into the Dokploy server
    deps:
      - gen:ssh
    cmds:
      - |
        set -a
        [ -f .env ] && . ./.env
        set +a
        : "${DOKPLOY_HOST:?DOKPLOY_HOST must be set, e.g. DOKPLOY_HOST=178.104.183.3}"
        ssh -o StrictHostKeyChecking=accept-new -i "${DOKPLOY_SSH_KEY:-$HOME/.ssh/personal_dokploy_ed25519}" root@"$DOKPLOY_HOST"

  reset:ssh:
    desc: Remove the Dokploy server from SSH known_hosts
    cmds:
      - |
        set -a
        [ -f .env ] && . ./.env
        set +a
        : "${DOKPLOY_HOST:?DOKPLOY_HOST must be set, e.g. DOKPLOY_HOST=178.104.183.3}"
        ssh-keygen -R "$DOKPLOY_HOST"

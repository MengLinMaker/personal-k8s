version: "3"

vars:
  TF_DIR: terraform
  IMAGE_DIR: terraform/image
  CLUSTER_DIR: terraform/cluster

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  fmt:
    desc: Format OpenTofu files
    cmds:
      - tofu -chdir={{.TF_DIR}} fmt -recursive

  watch:fmt:
    desc: Watch OpenTofu files and format on change; does not touch live infrastructure
    watch: true
    sources:
      - "{{.TF_DIR}}/**/*.tf"
    cmds:
      - tofu -chdir={{.TF_DIR}} fmt -recursive

  lint:
    desc: Lint OpenTofu configuration
    cmds:
      - tofu -chdir={{.IMAGE_DIR}} validate
      - tofu -chdir={{.CLUSTER_DIR}} validate

  watch:lint:
    desc: Watch OpenTofu files and lint on change; does not touch live infrastructure
    watch: true
    sources:
      - "{{.TF_DIR}}/**/*.tf"
      - "{{.TF_DIR}}/**/*.tfvars"
    cmds:
      - tofu -chdir={{.IMAGE_DIR}} validate
      - tofu -chdir={{.CLUSTER_DIR}} validate

  check:
    desc: Format and lint OpenTofu
    deps: [fmt, lint]

  watch:check:
    desc: Watch OpenTofu files, then format and lint; does not touch live infrastructure
    watch: true
    sources:
      - "{{.TF_DIR}}/**/*.tf"
      - "{{.TF_DIR}}/**/*.tfvars"
    cmds:
      - tofu -chdir={{.TF_DIR}} fmt -recursive
      - tofu -chdir={{.IMAGE_DIR}} validate
      - tofu -chdir={{.CLUSTER_DIR}} validate

  plan:image:
    desc: Plan Talos image changes
    cmds:
      - tofu -chdir={{.IMAGE_DIR}} plan

  apply:image:
    desc: Apply Talos image changes
    cmds:
      - tofu -chdir={{.IMAGE_DIR}} apply

  plan:cluster:
    desc: Plan cluster changes
    cmds:
      - tofu -chdir={{.CLUSTER_DIR}} plan

  apply:cluster:
    desc: Apply cluster changes
    cmds:
      - tofu -chdir={{.CLUSTER_DIR}} apply

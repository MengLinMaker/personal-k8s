version: "3"

vars:
  TF_DIR: terraform

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  fmt:
    desc: Format OpenTofu files
    cmds:
      - tofu -chdir={{.TF_DIR}} fmt

  watch:fmt:
    desc: Watch OpenTofu files and format on change; does not touch live infrastructure
    watch: true
    sources:
      - "{{.TF_DIR}}/**/*.tf"
    cmds:
      - tofu -chdir={{.TF_DIR}} fmt

  lint:
    desc: Lint OpenTofu configuration
    cmds:
      - tofu -chdir={{.TF_DIR}} validate

  watch:lint:
    desc: Watch OpenTofu files and lint on change; does not touch live infrastructure
    watch: true
    sources:
      - "{{.TF_DIR}}/**/*.tf"
      - "{{.TF_DIR}}/**/*.tfvars"
    cmds:
      - tofu -chdir={{.TF_DIR}} validate

  check:
    desc: Format and lint OpenTofu
    deps: [fmt, lint]

  watch:check:
    desc: Watch OpenTofu files, then format and lint; does not touch live infrastructure
    watch: true
    sources:
      - "{{.TF_DIR}}/**/*.tf"
      - "{{.TF_DIR}}/**/*.tfvars"
    cmds:
      - tofu -chdir={{.TF_DIR}} fmt
      - tofu -chdir={{.TF_DIR}} validate

  plan:
    desc: Plan OpenTofu changes
    cmds:
      - tofu -chdir={{.TF_DIR}} plan

  apply:
    desc: Apply OpenTofu changes
    cmds:
      - tofu -chdir={{.TF_DIR}} apply

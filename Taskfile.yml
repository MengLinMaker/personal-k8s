version: "3"

vars:
  TF_DIR: terraform
  K3S_DIR: hetzner-k3s

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  # OpenTofu checks
  fmt:
    desc: Format OpenTofu files
    internal: true
    cmds:
      - tofu -chdir={{.TF_DIR}} fmt -recursive

  watch:fmt:
    desc: Watch OpenTofu files and format on change; does not touch live infrastructure
    internal: true
    watch: true
    sources:
      - "{{.TF_DIR}}/**/*.tf"
    cmds:
      - tofu -chdir={{.TF_DIR}} fmt -recursive

  lint:
    desc: Lint OpenTofu configuration
    internal: true
    cmds:
      - tofu -chdir={{.TF_DIR}} validate

  watch:lint:
    desc: Watch OpenTofu files and lint on change; does not touch live infrastructure
    internal: true
    watch: true
    sources:
      - "{{.TF_DIR}}/**/*.tf"
      - "{{.TF_DIR}}/**/*.tfvars"
    cmds:
      - tofu -chdir={{.TF_DIR}} validate

  check:
    desc: Format and lint OpenTofu
    deps: [fmt, lint]

  watch:check:
    desc: Watch OpenTofu files, then format and lint; does not touch live infrastructure
    watch: true
    sources:
      - "{{.TF_DIR}}/**/*.tf"
      - "{{.TF_DIR}}/**/*.tfvars"
    cmds:
      - tofu -chdir={{.TF_DIR}} fmt -recursive
      - tofu -chdir={{.TF_DIR}} validate

  # k3s lifecycle
  k3s:gen:ssh:
    cmds:
      - |
        if [ -e "$HOME/.ssh/personal_k3s_ed25519" ]; then
          echo "$HOME/.ssh/personal_k3s_ed25519 already exists"
          exit 0
        fi
        ssh-keygen -t ed25519 -N "" -C personal-k3s -f "$HOME/.ssh/personal_k3s_ed25519"

  k3s:deploy:
    desc: Create the single-node hetzner-k3s cluster
    dir: "{{.K3S_DIR}}"
    dotenv:
      - .env
    deps:
      - k3s:gen:ssh
    preconditions:
      - sh: test -n "$HCLOUD_TOKEN"
        msg: HCLOUD_TOKEN must be set
      - sh: test -f cluster.yaml
        msg: hetzner-k3s/cluster.yaml is missing
    cmds:
      - DEBUG=true hetzner-k3s create --config cluster.yaml --skip-current-ip-validation

  k3s:bootstrap:
    desc: Create the k3s cluster and sync baseline platform resources
    cmds:
      - task k3s:deploy
      - task k3s:sync

  k3s:destroy:
    desc: Delete the single-node hetzner-k3s cluster
    dir: "{{.K3S_DIR}}"
    dotenv:
      - .env
    preconditions:
      - sh: test -n "$HCLOUD_TOKEN"
        msg: HCLOUD_TOKEN must be set
      - sh: test -f cluster.yaml
        msg: hetzner-k3s/cluster.yaml is missing
    cmds:
      - hetzner-k3s delete --config cluster.yaml

  k3s:sync:
    desc: Ensure Flux is installed and apply local platform resources
    cmds:
      - task k3s:flux
      - task k3s:apply-platform

  # k3s access and debugging
  k3s:ssh:
    desc: SSH into the single-node hetzner-k3s server
    dir: "{{.K3S_DIR}}"
    dotenv:
      - .env
    preconditions:
      - sh: test -n "$K3S_HOST"
        msg: K3S_HOST must be set, e.g. K3S_HOST=138.199.152.218
      - sh: test -f ~/.ssh/personal_k3s_ed25519
        msg: Run task k3s:gen:ssh first
    cmds:
      - ssh -i ~/.ssh/personal_k3s_ed25519 root@"$K3S_HOST"

  k3s:ssh:check:
    dir: "{{.K3S_DIR}}"
    dotenv:
      - .env
    preconditions:
      - sh: test -n "$K3S_HOST"
        msg: K3S_HOST must be set, e.g. K3S_HOST=138.199.152.218
      - sh: test -f ~/.ssh/personal_k3s_ed25519
        msg: Run task k3s:gen:ssh first
    cmds:
      - ssh -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=10 -i ~/.ssh/personal_k3s_ed25519 root@"$K3S_HOST" 'hostname && whoami && cloud-init status --long'

  k3s:kubectl:
    desc: Run kubectl against the single-node hetzner-k3s cluster
    dir: "{{.K3S_DIR}}"
    dotenv:
      - .env
    preconditions:
      - sh: test -f kubeconfig
        msg: Run task k3s:deploy first
    cmds:
      - KUBECONFIG="$PWD/kubeconfig" kubectl {{.CLI_ARGS}}

  k3s:k9s:
    desc: Open k9s against the single-node hetzner-k3s cluster
    dir: "{{.K3S_DIR}}"
    dotenv:
      - .env
    preconditions:
      - sh: test -f kubeconfig
        msg: Run task k3s:deploy first
    cmds:
      - KUBECONFIG="$PWD/kubeconfig" k9s {{.CLI_ARGS}}

  k3s:hubble:
    desc: Port-forward Hubble UI locally
    dir: "{{.K3S_DIR}}"
    dotenv:
      - .env
    preconditions:
      - sh: test -f kubeconfig
        msg: Run task k3s:deploy first
    cmds:
      - KUBECONFIG="$PWD/kubeconfig" kubectl -n kube-system port-forward svc/hubble-ui 12000:80

  k3s:flux:
    dir: "{{.K3S_DIR}}"
    dotenv:
      - .env
    preconditions:
      - sh: test -f kubeconfig
        msg: Run task k3s:deploy first
    cmds:
      - KUBECONFIG="$PWD/kubeconfig" flux install

  k3s:apply-platform:
    dir: "{{.K3S_DIR}}"
    dotenv:
      - .env
    preconditions:
      - sh: test -f kubeconfig
        msg: Run task k3s:deploy first
      - sh: test -f platform/kustomization.yaml
        msg: hetzner-k3s/platform/kustomization.yaml is missing
    cmds:
      - |
        rendered="$(kubectl kustomize platform)"
        if [ -z "$rendered" ]; then
          echo "No platform resources to apply"
        else
          printf '%s\n' "$rendered" | KUBECONFIG="$PWD/kubeconfig" kubectl apply -f -
        fi
